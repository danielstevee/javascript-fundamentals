<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    body div {
        width: 60%;
        margin: 8px;
        padding: 5px;
        border: 2px solid black;
    }
</style>

<body>
    <div align="center" id="langit">
        LANGIT
        <div align="center" id="luar">
            LUAR
            <div align="center" id="tengah">
                TENGAH
                <div align="center" id="dalam">
                    DALAM
                </div>
            </div>
        </div>
    </div>

    <script>
        //mirip bubbling namun dari perents ke child
        //jika tidak ingin berurut tambahkan event.stopPropagation();
        //dan hapus true agar sifat ini berhenti
        const divs = document.getElementsByTagName('div');
        for (let el of divs) {
            el.addEventListener('click', function () {
                alert('ELEMEN ' + el.getAttribute('id').toUpperCase());
            }, true);
        }
    </script>
</body>

</html>
