<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/output.css" rel="stylesheet">
</head>

<body>

    <h1 id="iniId1" class="bg-blue-500 text-white py-4 text-center"></h1>
    <script>
        // for...of  → looping VALUE / ELEMEN
        const user = ['Daniel', 'Mario', "Louisa"];
        for (const data of user){
            //Menampilkan nilai yang ada di const data------------
            console.log(data);                                  
            document.getElementById('iniId1').textContent += data;
        }
    </script>



</body>

</html>
