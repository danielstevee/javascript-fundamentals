const products = [
    {
        name: 'Laptop',
        price: 10000000,
        category: 'Elektronik',
    },
];
function addProduct(name, price, category) {
    //push nilai ke array products

    nama :name,
    harga :price,
    kategori: category});
}
//start function dgn nilai ini-------------
addProduct('Handphone', 5000, 'Elektronik');
