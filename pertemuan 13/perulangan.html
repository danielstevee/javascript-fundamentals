<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/output.css" rel="stylesheet">
</head>

<body>

    <h1 id="Pesan" class="bg-blue-500 text-white py-4 text-center"></h1>
    <h1 id="Pesan1" class="bg-red-500 text-white py-4 text-center"> </h1>

    <script>
    // for ini untuk perulangan, yang kita tau kapan dia harus berenti
    let elememtById = document.getElementById("Pesan");

    for(let i = 5; i <= 50; i+=5){
        elememtById.textContent+= (i + ", ");
    }

    let elememtById1 = document.getElementById("Pesan1");
    let total = 1;
    for(let i = 1; i<=5; i++){
        total *= i;
    }
    elememtById1.textContent = ("Hasil perkalian 1 sampai 5 adalah: " + total);
    
    </script>

</body>

</html>
