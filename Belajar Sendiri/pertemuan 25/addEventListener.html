<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/output.css" rel="stylesheet">
</head>

<body>
    
    <section id="main" class="min-h-screen text-center py-20 transition-all duration-300">

        <h1 id="teks" class=" text-2xl font-bold ">Halo, Selamat Datang</h1>
        <button id="tombolubah"
            class="hover:bg-blue-700 transition-all mt-4 px-9 py-2 rounded bg-blue-600 text-lg text-white cursor-pointer">Login</button>
    </section>


    <script>
 /* ==============================================================================
   CATATAN PEMAHAMAN: onclick VS addEventListener
   ============================================================================== */

// 1. onclick
// ------------------------------------------------------------------------------
// - Karakteristik : Menimpa (Overwrite). Hanya bisa menampung 1 fungsi terakhir.
// - Penggunaan    : Cocok untuk proyek pribadi/kecil yang diketik sendiri di 1 file.
// - Kelemahan     : Jika ada file JS lain yang menempelkan .onclick di tombol sama,
//                   fungsi pertama akan TERHAPUS/DITIMPA oleh fungsi kedua.

// 2. addEventListener
// ------------------------------------------------------------------------------
// - Karakteristik : Menumpuk (Stacking/Listening). Bisa menampung banyak fungsi.
// - Penggunaan    : Wajib untuk kerja tim / proyek menengah-besar / banyak file JS.
// - Keunggulan    : Berbeda file tetap bisa jalan barengan di 1 tombol yang sama.

/* ==============================================================================
   CONTOH KERJA TIM (2 File JS Berbeda untuk 1 Tombol yang Sama atau id nya sama)
   ==============================================================================
   Struktur HTML:
   <button id="button1">Login</button>
*/
// FILE 1: login.js (Diketik oleh KAMU - Fokus ke Tampilan/UI) pokok tertuju id button1
// FILE 2: database.js (Diketik oleh TEMANMU - Fokus ke Server/Database) pokok tertuju id button1
// jadi ga ngerjain di 1 file yang sama lebih bagus untuk kerja tim

    //akses elemen
    let main = document.getElementById("main");
    let teks = document.getElementById("teks");
    let tombolubah =  document.getElementById("tombolubah");

    //fungsi/perintah yang dijalan kan 
    function ubah (){
        
        if (teks.innerHTML === "Halo, Selamat Datang") {
                teks.innerHTML = "Halo, Selamat Datang Daniel";
            } else {
                teks.innerHTML = "Halo, Selamat Datang";
            }
        
        main.classList.toggle("bg-black"); 
        main.classList.toggle("text-white"); 
    }
    //jalankan event
    tombolubah.addEventListener("click", ubah);
    </script>


</body>

</html>
