<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/output.css" rel="stylesheet">
</head>

<body>
    <div class="max-w-6xl mx-auto text-center">
    <h1 id="judul" class=" text-black font-bold text-5xl my-8 text-center"> Judul Saat Ini </h1>
    <button onclick="ubahJudul()" class=" rounded bg-blue-500 hover:bg-blue-600  transition-all px-9 py-2 text-white ">Ubah Judul</button>
    </div>
    
    <script>
        function ubahJudul() {
            let judulBaru = prompt("Masukan Judul Baru:");
            document.getElementById("judul").textContent= judulBaru;
        }


    </script>

</body>

</html>
