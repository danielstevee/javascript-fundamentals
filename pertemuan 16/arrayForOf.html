<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/output.css" rel="stylesheet">
</head>

<body>

    <h1 id="Pesan" class="bg-blue-500 text-white py-4 text-center"></h1>

    <script>
        //ini paling mudah pake for of ketimbang loop pake let i <= ...
     let buah = ["apel","pisang","durian"];
    
     for(let item of buah){
        document.getElementById("Pesan").textContent+=(item + ",");
     }
    </script>

</body>

</html>
