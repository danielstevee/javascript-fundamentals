    <script>
    
    //ini untuk 1 kompenen saja <h1> dgn id judul
    let simpan = document.getElementById("judul");
    console.log(simpan);

    


    //ini untuk banyak element seperti grup dan memiliki indeks seperti array (perlu dark.length untuk bisa membaca urutan index card yang disimpan di let dark)
    //1 pake perulangan for 
    let dark = document.getElementsByClassName("card");
    for(let i = 0; i < dark.length; i++ ){
        dark[i].style.backgroundColor = "#222";
    }
    //2 pake perulangan for of (let item untuk menyimpan urutan index dari let yellow yang menyimpan index card2 [0.1.2.3])
    let yellow = document.getElementsByClassName("card2");
    for (let item of yellow){
        item.style.backgroundColor = "#222";
    }




    //Tag HTML langsung -> querySelector("h2")
    let selector = document.querySelector("h2");
    console.log(selector);

    //ID pakai -> (#)
    let selector2 = document.querySelector("#judul");
    console.log(selector2);

    //Class pakai -> (.)
    let selector3 = document.querySelector(".kartu");
    console.log(selector3);

    //Spesifik Selector untuk menargetkan elemen tertentu tanpa menggangu elemen serupa di bagian lain
    let selector4 = document.querySelector("#home, .hero, h1");
    console.log(selector4)

    //Mengambil semua element yang nama nya sama, mirip getElementByClassName. beda nya ini bisa akses id, class, tag.
    let kontak = document.querySelectorAll("#kontak, .get, .teks");
    console.log(kontak)

    
    </script>
